name: build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "upstream.version"
      - "fnos.version"
      - "packaging/**"
  workflow_dispatch:
    inputs:
      zcode_ref:
        description: "ZCode ref (tag / branch / commit)，留空用 upstream.version 里钉住的值"
        required: false
        default: ""

env:
  NODE_VERSION: "24.14.0"
  PNPM_VERSION: "10.33.2"

jobs:
  runtime:
    name: Build ZCode web runtime (linux)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Resolve pinned ZCode ref
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.zcode_ref }}" ]; then
            REF="${{ github.event.inputs.zcode_ref }}"
          else
            REF="$(curl -fsSL -H "Authorization: token $GH_TOKEN" \
              "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/upstream.version")"
          fi
          REF="$(echo "$REF" | head -n 1 | tr -d '[:space:]')"
          echo "Pinned ZCode ref: $REF"
          # upstream.version 应始终钉 40 位 commit sha（上游无 release tag）；
          # 也兼容分支/tag 名。注意 git ls-remote 无法解析裸 SHA，要先判长度。
          if [ "${#REF}" -eq 40 ] && [[ "$REF" =~ ^[0-9a-f]+$ ]]; then
            SHA="$REF"
          else
            SHA="$(git ls-remote https://github.com/zai-org/ZCode.git "$REF" | awk '{print $1}')"
            [ -n "$SHA" ] || { echo "ref 不存在：$REF"; exit 1; }
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned ZCode commit: $SHA"

      - name: Checkout ZCode at pinned commit
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ steps.pin.outputs.sha }}
          path: zcode
          fetch-depth: 1

      - name: Setup Node + pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
        # Node 版本在下一步装（mise 钉 24.14.0）

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: zcode
        run: pnpm install --frozen-lockfile

      - name: Build runtime
        working-directory: zcode
        run: |
          set -e
          # packages/{shared,services,client} 没有 build 脚本，其 dist 由根 typecheck
          # （tsc -b，composite 工程会真实产出 JS）生成；TUI runtime 闭包收集器要求
          # 这些 dist 存在，否则报 Missing @zcode/shared dist files。
          pnpm typecheck
          # build:zcode = 官方打包入口：先构建 CLI 及依赖，再构建 server/web，
          # 最后组装 runtime tarball。
          node scripts/build-zcode.mjs --base-url http://127.0.0.1/zcode/

      - name: Resolve version
        id: ver
        working-directory: zcode
        run: |
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ZCode version: $VERSION"

      - name: Collect artifacts
        working-directory: zcode
        run: |
          mkdir -p ../out
          cp dist/zcode/releases/*/zcode-*.tar.gz ../out/
          cp dist/zcode/latest.json ../out/ 2>/dev/null || true
          ls -la ../out

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-runtime-${{ steps.ver.outputs.version }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  fpk:
    name: Package fnOS fpk
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download runtime artifact
        uses: actions/download-artifact@v4
        with:
          name: zcode-runtime-${{ needs.runtime.outputs.version }}
          path: packaging/fnOS/dist/runtime

      - name: Build fpk
        run: bash packaging/fnOS/scripts/build.sh

      - name: Verify fpk contents
        run: |
          set -e
          FPK="$(ls packaging/fnOS/dist/zcode-*.fpk)"
          echo "fpk: $FPK ($(du -h "$FPK" | cut -f1))"
          tar -tzf "$FPK" | head -20
          echo "--- 版本 ---"
          tar -xOf "$FPK" manifest | grep -E "^version|^service_port|^install_dep_apps"
          echo "--- 解包 app.tgz ---"
          # 注意：无 fnpack 时 build.sh 走 `tar -czf . ` 等价打包，条目带 "./" 前缀；
          # fnpack 产物则不带。两种都要能处理，所以整包解出来再判断，别依赖条目前缀。
          rm -rf /tmp/fpkcheck && mkdir -p /tmp/fpkcheck
          tar -xzf "$FPK" -C /tmp/fpkcheck app.tgz
          tar -xzf /tmp/fpkcheck/app.tgz -C /tmp/fpkcheck
          echo "--- 网关接入层必须在包内 ---"
          [ -f /tmp/fpkcheck/gateway/gateway.mjs ] || { echo "✗ 缺 gateway/gateway.mjs"; exit 1; }
          [ -f /tmp/fpkcheck/gateway/url-compat.js ] || { echo "✗ 缺 gateway/url-compat.js"; exit 1; }
          echo "--- ui/config 必须指向网关 ---"
          grep -q '"gatewaySocket": "zcode.sock"' /tmp/fpkcheck/ui/config || { echo "✗ gatewaySocket 不对"; exit 1; }
          grep -q '"gatewayPrefix": "/app/zcode"' /tmp/fpkcheck/ui/config || { echo "✗ gatewayPrefix 不对"; exit 1; }
          echo "--- 入口令牌脚本必须认识保留首段 ---"
          grep -q 'zcode-fnos-entry-token' /tmp/fpkcheck/runtime/web/index.html || { echo "✗ 未注入入口令牌脚本"; exit 1; }
          grep -q 'RESERVED' /tmp/fpkcheck/runtime/web/index.html || { echo "✗ 令牌脚本未排除保留首段"; exit 1; }
          echo "✓ 包结构自检通过"

      - name: Smoke-test gateway layer
        run: |
          # 网关接入层不依赖 ZCode server 也能起：监听失败会立刻退出。
          # 验证它能监听 unix socket、前缀外请求 404、前缀内请求会转发到后端
          # （后端不存在 → 502，属预期，说明转发路径正确）。
          set -e
          GW_DIR=/tmp/fpkcheck/gateway
          node "$GW_DIR/gateway.mjs" --socket /tmp/zcode-smoke.sock \
            --prefix /app/zcode --port 1 --token smoke --log /tmp/zcode-smoke.log &
          GW=$!
          for i in $(seq 1 15); do [ -S /tmp/zcode-smoke.sock ] && break; sleep 1; done
          [ -S /tmp/zcode-smoke.sock ] || { echo "✗ 网关未能监听"; cat /tmp/zcode-smoke.log; exit 1; }
          echo "✓ 网关已监听"
          code=$(curl -s -o /dev/null -w '%{http_code}' --unix-socket /tmp/zcode-smoke.sock http://localhost/other || true)
          [ "$code" = "404" ] || { echo "✗ 前缀外请求应 404，实际 $code"; exit 1; }
          echo "✓ 前缀外请求 404"
          code=$(curl -s -o /dev/null -w '%{http_code}' --unix-socket /tmp/zcode-smoke.sock http://localhost/app/zcode/ || true)
          [ "$code" = "502" ] || { echo "✗ 后端不在时应 502，实际 $code"; exit 1; }
          echo "✓ 前缀内请求已转发（后端未启动 → 502，符合预期）"
          kill "$GW" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-fpk-${{ needs.runtime.outputs.version }}
          path: packaging/fnOS/dist/zcode-*.fpk
          retention-days: 30
          if-no-files-found: error
